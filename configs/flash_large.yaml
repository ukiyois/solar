model:
  backbone: large
  context_size: 1024
  feature_dim: 192
  mask_dim: 64
  detail_channels: 32
  queries: 64
  decoder_layers: 6
  heads: 6
  memory_grid: 48
  seed_tokens: 256
  curve_points: 7
  curve_step: 0.75
  detail_tile: 512
  detail_halo: 48
  dcn_backend: native
  backbone_checkpointing: true
  detail_checkpointing: true
  curve_enabled: true
  curve_channels: 16
  detail_downsample: haar
  phase_dim: 8
  global_attention_every: 2
  mask_feedback: true
  pretrained: weights/flash_intern_image_l_backbone.pt
train:
  data_root: data/raw/MAGFiLO_1.0_Kaggle_2026
  output: runs/flash_large_v2
  cache_dir: data/cache
  require_cache: true
  fold: 0
  folds: 5
  seed: 2026
  epochs: 80
  batch_size: 1
  accumulation: 1
  workers: 4
  prefetch_factor: 2
  cuda_prefetch: true
  learning_rate: 0.0002
  backbone_learning_rate: 0.00002
  stage_lr_decay: 0.8
  offset_lr_scale: 0.1
  weight_decay: 0.05
  warmup_epochs: 3
  minimum_lr_ratio: 0.02
  fused_adamw: true
  betas: [0.9, 0.999]
  adam_epsilon: 0.00000001
  clip_grad_norm: 1.0
  amp: true
  initial_scale: 4096
  photometric: true
  ema: true
  ema_decay: 0.999
  compile: off
  compile_backend: inductor
  compile_mode: default
  compile_fullgraph: false
  log_every: 20
  point_samples: 8192
  validate_every: 2
loss:
  topology_iterations: 8
  structural_warmup: 5
inference:
  score_threshold: 0.35
  mask_threshold: 0.5
  min_area: 32
  query_chunk: 4
  min_retained_fraction: 0.5
  amp: true
