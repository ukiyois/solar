[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-filaments"
version = "1.0.0"
description = "Solar filament instance segmentation in GONG H-alpha images (FlashInternImage-L query model, PQ surrogate, Noisy-Student self-training)"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy>=1.24", "scipy>=1.10", "Pillow>=9", "pycocotools>=2.0.7", "PyYAML>=6", "requests>=2.31", "opencv-python>=4.8", "scikit-image>=0.21", "yacs>=0.1.8"]

[tool.setuptools.packages.find]
include = ["solar_filaments*"]
